<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser 4 Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            border: 2px solid #34495e;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .controls {
            color: white;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        /* New styles for character selector */
        .top-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        .top-bar label { color: #ecf0f1; }
        .top-bar select {
            background: #34495e;
            color: #ecf0f1;
            border: 1px solid #566573;
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div style="position:relative;">
        <div class="top-bar">
            <label for="character-select">Персонаж:</label>
            <select id="character-select">
                <option value="sofi" selected>Sofi</option>
                <option value="kiwi">Kiwi</option>
            </select>
        </div>
        <div id="game-container"></div>
        <div class="controls">
            Керування: A/D або ←/→ для руху, W або ↑/Пробіл для стрибка
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
